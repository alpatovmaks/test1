{{define "expense_form.html"}}
{{template "layout" .}}
{{end}}

{{define "content"}}
<h1>Новая трата</h1>

{{if .Error}}<p class="error">{{.Error}}</p>{{end}}

<form method="POST" action="/expenses">
    <label>Сумма:
        <input type="number" step="0.01" min="0" name="amount" value="{{.Form.Amount}}" required>
    </label>
    <label>Описание:
        <input type="text" name="description" value="{{.Form.Description}}" required>
    </label>
    <label>Дата:
        <input type="date" name="date" value="{{.Form.Date}}" required>
    </label>
    <button type="submit">Сохранить</button>
</form>
{{end}}
