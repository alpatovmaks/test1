{{define "content"}}
<h2>{{.Title}}</h2>

{{if .Error}}
<p class="error">{{.Error}}</p>
{{end}}

<form method="POST" action="{{if .Edit}}/edit?id={{.Expense.ID}}{{else}}/add{{end}}">
    <p>
        <label>Сумма (₽):<br>
            <input type="number" name="amount" step="0.01" min="0.01" required
                   value="{{if .Expense}}{{.Expense.Amount}}{{end}}">
        </label>
    </p>
    <p>
        <label>Описание:<br>
            <input type="text" name="description" maxlength="200" required
                   value="{{if .Expense}}{{.Expense.Description}}{{end}}">
        </label>
    </p>
    <p>
        <label>Дата:<br>
            <input type="date" name="date" required
                   value="{{if .Expense}}{{.Expense.Date.Format "2006-01-02"}}{{end}}">
        </label>
    </p>
    <button type="submit">Сохранить</button>
    <a href="/">Отмена</a>
</form>
{{end}}
